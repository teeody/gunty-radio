<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gunty Radio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1d16; --bg2:#22271d; --panel:#3a4334; --panel2:#2a3125; --panel3:#4a5542;
  --bevel-hi:#7a8770; --bevel-lo:#12160f; --line:#5f6b56;
  --lcd:#1c2716; --lcd2:#0f160c; --lime:#9dff57; --lime2:#d7ff9d; --amber:#ffcc4d;
  --text:#e8efe0; --text-dim:#aebba3; --red:#ff5f5f;
  --shadow:0 6px 0 rgba(0,0,0,.35);
  --r:0px;
}
html{font-family:Tahoma,Verdana,"MS Sans Serif",Arial,sans-serif;background:var(--bg);color:var(--text);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;overflow-x:hidden;color:var(--text);
  background:
    linear-gradient(180deg,rgba(255,255,255,.03),transparent 30%),
    repeating-linear-gradient(180deg,#1a1d16 0,#1a1d16 2px,#171a13 2px,#171a13 4px);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.35) 2px,rgba(0,0,0,.35) 4px)}

@keyframes eqBar{0%,100%{height:4px}50%{height:18px}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 1px rgba(236,72,153,.5),0 0 26px -6px rgba(139,92,246,.6)}50%{box-shadow:0 0 0 1px rgba(34,211,238,.7),0 0 44px -4px rgba(59,130,246,.75)}}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.78)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* HEADER / WINAMP */
.header{position:sticky;top:0;z-index:100;padding:10px 12px;background:linear-gradient(180deg,#596553,#303828 55%,#252b1f);border-bottom:2px solid #111;border-top:1px solid #8a9680;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 0 rgba(0,0,0,.25)}
.header::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:2px;background:linear-gradient(90deg,#111,#6f7a63,#111);opacity:.7}
.header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:4px 8px;border:2px solid #171b13;background:linear-gradient(180deg,#20261b,#12160f);box-shadow:inset 1px 1px 0 #6f7a63,inset -1px -1px 0 #000}
.logo-icon{width:34px;height:34px;flex-shrink:0;border:2px solid #111;background:radial-gradient(circle at 30% 30%,#d7ff9d,#8cff3f 35%,#2b4a15 70%,#111 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 0 10px rgba(143,255,91,.25)}
.logo-icon::before,.logo-icon::after{display:none}
.logo-text{font-size:28px;font-weight:900;letter-spacing:2px;line-height:1;color:#d7ff9d;text-shadow:0 0 8px rgba(157,255,87,.45),2px 2px 0 #111;font-family:"Arial Black",Impact,Tahoma,sans-serif}
.search-wrap{flex:1;min-width:220px;max-width:420px;position:relative}
.search{width:100%;padding:10px 12px 10px 36px;background:linear-gradient(180deg,#10150d,#1b2316);border:2px solid #111;color:#9dff57;font:700 13px "Courier New",monospace;outline:none;box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 #66725b}
.search::placeholder{color:#72905b}
.search:hover,.search:focus{border-color:#6f8e4d;box-shadow:inset 1px 1px 0 #000,0 0 0 1px #9dff57}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9dff57}
.filters{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:6px}
.filter-btn{padding:7px 10px;border:2px solid #111;background:linear-gradient(180deg,#697560,#3b4635);color:#eef5e4;font:700 11px Tahoma,Verdana,sans-serif;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;box-shadow:inset 1px 1px 0 #98a58c,inset -1px -1px 0 #141a11}
.filter-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.filter-btn.active,.filter-btn:focus-visible{background:linear-gradient(180deg,#d4decc,#909d84);color:#1a2115;outline:none;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #4a5542}

/* MAIN */
.main{max-width:1240px;margin:0 auto;padding:18px 12px 24px}
.stations-grid{display:grid;grid-template-columns:1fr;gap:15px}

/* STATION CARD */
.station-card{position:relative;overflow:hidden;cursor:pointer;padding:14px;border:2px solid #111;background:linear-gradient(180deg,#56614d,#353e30 18%,#2b3326);box-shadow:inset 1px 1px 0 #87947b,inset -1px -1px 0 #0d110b,0 4px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s;animation:slideUp .2s ease both}
.station-card::before{content:"";position:absolute;top:0;left:0;right:0;height:18px;background:linear-gradient(180deg,#7b8870,#4f5a46);border-bottom:1px solid #111;opacity:.95}
.station-card::after{display:none}
.station-card:hover{filter:brightness(1.05);transform:translateY(-1px)}
.station-card:focus-visible{outline:2px solid #9dff57;outline-offset:2px}
.station-card:nth-child(1){animation-delay:.02s}
.station-card:nth-child(2){animation-delay:.06s}
.station-card:nth-child(3){animation-delay:.1s}
.station-card:nth-child(4){animation-delay:.14s}
.station-card:nth-child(5){animation-delay:.18s}
.station-card:nth-child(6){animation-delay:.22s}
.station-card:nth-child(7){animation-delay:.26s}
.station-card:nth-child(8){animation-delay:.3s}
.station-card:nth-child(9){animation-delay:.34s}
.station-card:nth-child(10){animation-delay:.38s}
.station-card:nth-child(n+11){animation-delay:.42s}
.station-card.playing{
  background:
    linear-gradient(rgba(12,12,26,.94),rgba(12,12,26,.94)) padding-box,
    var(--grad) border-box;
  border:1.5px solid transparent;
  
}
.station-card-top{display:flex;align-items:flex-start;gap:13px;margin-bottom:13px;position:relative;z-index:1}
.station-icon{
  width:52px;height:52px;border-radius:0;flex-shrink:0;border:2px solid #111;
  background:linear-gradient(180deg,#20271b,#10150d)!important;color:#9dff57!important;
  box-shadow:inset 1px 1px 0 #66725b,inset -1px -1px 0 #000;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#fff;letter-spacing:.5px;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.28);
  position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
}
.station-icon::after{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
}
.station-card:hover .station-icon{transform:scale(1.06) rotate(-3deg)}
.station-meta{flex:1;min-width:0}
.station-name{font-size:15px;font-weight:900;line-height:1.25;margin-bottom:4px;color:#f0f5e8;letter-spacing:.2px;text-transform:uppercase}
.station-desc{
  font-size:12px;color:#bcc8b0;line-height:1.4;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.station-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;position:relative;z-index:1}
.tag{padding:3px 8px;border:1px solid #111;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#1a2115;color:#b7ff76;box-shadow:inset 1px 1px 0 #394333}
.station-bottom{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.station-status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim);font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(16,185,129,.95)}
.station-card.playing .station-status{color:var(--green-2)}
.station-play-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);
  background:var(--glass-2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s ease;
  -webkit-appearance:none;appearance:none;
}
.station-play-btn:hover{
  background:var(--grad);border-color:transparent;color:#fff;
  transform:scale(1.1);box-shadow:0 8px 22px -8px rgba(236,72,153,.95);
}
.station-play-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.station-card.playing .station-play-btn{
  background:var(--grad);background-size:200% 100%;
  animation:gradShift 6s ease infinite;
  border-color:transparent;color:#fff;
  box-shadow:0 8px 22px -8px rgba(139,92,246,.95);
}

/* NOW PLAYING BAR */
.now-playing-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  padding:12px 16px;display:none;
  background:rgba(9,9,20,.78);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  backdrop-filter:blur(20px) saturate(170%);
  border-top:1px solid var(--line);
  box-shadow:0 -16px 44px -22px rgba(0,0,0,1);
  animation:slideUp .3s ease;
}
.now-playing-bar.active{display:block}
.now-playing-bar::before{
  content:'';position:absolute;top:-1px;left:0;right:0;height:2px;
  background:var(--grad);background-size:200% 100%;
  animation:gradShift 8s ease infinite;
}
.now-playing-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:11px}
.np-station-icon{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#fff;letter-spacing:.5px;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.28);
  position:relative;overflow:hidden;
  animation:floaty 5s ease-in-out infinite;
}
.np-station-icon::after{
  content:'';position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
}
.np-info{flex:1;min-width:0}
.np-station-name{
  font-size:13.5px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-track{
  font-size:11px;color:var(--text-dim);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.np-track .np-artist{color:var(--cyan);font-weight:700}
.np-track .np-song{color:var(--text-2);font-weight:600}
.np-track.is-id{
  color:var(--text-2);
  -webkit-animation:slideDown .32s ease both;animation:slideDown .32s ease both;
}
.np-track.is-id::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green-2);margin-right:6px;vertical-align:middle;
  box-shadow:0 0 8px var(--green-2);
  -webkit-animation:dotPulse 1.7s ease-in-out infinite;animation:dotPulse 1.7s ease-in-out infinite;
}
.np-track.is-none{color:var(--text-dim);font-style:italic;opacity:.8}
.np-track.is-none::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--text-dim);margin-right:6px;vertical-align:middle;opacity:.55;
}
.np-track.is-manual .np-artist,.np-track.is-manual{color:var(--purple-2)}
.np-track.is-manual::after{
  content:'edited';margin-left:7px;font-size:9px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  color:var(--text-dim);opacity:.7;vertical-align:middle;
}
.np-track.is-none,.np-track.is-manual{cursor:pointer}
.np-track.is-none:hover{color:var(--text-2);opacity:1}
.np-track.is-id:hover{text-decoration:underline;text-decoration-color:var(--line-2)}
.np-track.is-editing{display:flex;align-items:center;gap:6px}
.np-track-input{
  width:100%;min-width:0;padding:2px 8px;border-radius:7px;
  background:var(--glass-2);border:1px solid rgba(34,211,238,.65);
  color:var(--text);font-family:inherit;font-size:11px;font-weight:600;
  outline:none;
}
.np-track-input:focus{
  border-color:var(--cyan);box-shadow:0 0 0 3px rgba(59,130,246,.18);
}
.np-track-input::placeholder{color:var(--text-dim);font-weight:500}
.np-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.np-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s ease;
  -webkit-appearance:none;appearance:none;
}
.np-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.np-btn-play{
  background:var(--grad);background-size:200% 100%;
  animation:gradShift 6s ease infinite;
  color:#fff;border-color:transparent;
  box-shadow:0 8px 22px -10px rgba(139,92,246,1);
}
.np-btn-play:hover{transform:scale(1.08)}
.np-btn-play.playing{animation:gradShift 6s ease infinite,glowPulse 2.6s ease-in-out infinite}
.np-btn-stop{background:var(--glass-2);color:var(--text-dim)}
.np-btn-stop:hover{background:var(--glass-3);color:var(--text);transform:scale(1.08)}
.np-volume{display:none;align-items:center;gap:7px}
.np-volume svg{width:16px;height:16px;color:var(--text-dim);flex-shrink:0}
.volume-slider{
  -webkit-appearance:none;appearance:none;
  width:82px;height:5px;border-radius:3px;
  background:var(--glass-3);outline:none;cursor:pointer;
}
.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--grad);background-size:cover;border:none;cursor:pointer;
  box-shadow:0 0 10px rgba(139,92,246,.9);
}
.volume-slider::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;border:none;
  background:var(--purple);cursor:pointer;
  box-shadow:0 0 10px rgba(139,92,246,.9);
}
.np-eq{display:flex;align-items:flex-end;gap:2px;height:20px;flex-shrink:0}
.np-eq span{
  width:3px;border-radius:2px;height:4px;
  background:var(--grad);background-size:100% 100%;
  animation:eqBar .8s ease-in-out infinite;
}
.np-eq span:nth-child(2){animation-delay:.1s}
.np-eq span:nth-child(3){animation-delay:.2s}
.np-eq span:nth-child(4){animation-delay:.3s}
.np-eq span:nth-child(5){animation-delay:.15s}

/* ERROR TOAST */
.error-toast{
  position:fixed;top:78px;left:16px;right:16px;z-index:300;
  display:none;padding:13px 17px;text-align:center;
  border-radius:0;
  background:rgba(30,10,40,.92);
  -webkit-
  border:1px solid rgba(236,72,153,.6);
  color:var(--pink-2);font-size:13px;font-weight:700;
  box-shadow:0 18px 40px -18px rgba(236,72,153,.6);
  animation:slideDown .3s ease;
}
.error-toast.show{display:block}

/* NO RESULTS */
.no-results{text-align:center;padding:70px 20px;color:var(--text-dim)}
.no-results-icon{
  width:70px;height:70px;border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  background:var(--glass);border:1px solid var(--line-2);
  box-shadow:var(--shadow);
}
.no-results p{font-size:14px;font-weight:700;color:var(--text-2)}

/* TABLET */
@media(min-width:600px){
  .header{padding:14px 24px}
  .header-inner{gap:16px}
  .logo-text{font-size:29px}
  .filters{width:auto;padding-top:0;justify-content:flex-end}
  .main{padding:26px 20px 132px}
  .stations-grid{grid-template-columns:repeat(2,1fr);gap:17px}
  .station-card{padding:20px}
  .station-name{font-size:17.5px}
  .now-playing-inner{gap:16px}
  .np-station-icon{width:52px;height:52px;font-size:18px}
  .np-station-name{font-size:15px}
  .np-volume{display:flex}
  .np-eq{display:flex}
  .error-toast{left:auto;right:24px;max-width:390px;text-align:left}
}

/* DESKTOP */
@media(min-width:960px){
  .header{padding:16px 32px}
  .logo-icon{width:48px;height:48px}
  .logo-text{font-size:33px}
  .main{padding:30px 32px 132px}
  .stations-grid{grid-template-columns:repeat(3,1fr);gap:19px}
  .station-card{padding:22px}
  .station-card:hover{transform:translateY(-5px)}
  .np-station-icon{width:56px;height:56px;font-size:20px}
  .np-station-name{font-size:16px}
  .np-track{font-size:12px}
  .volume-slider{width:100px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon"></div>
      <div class="logo-text">Gunty Radio</div>
    </div>
    <a class="report-link" href="mailto:teeody%2Bgithub@proton.me?subject=Gunty%20Radio%20Problem%20Report">Report a problem</a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search" placeholder="Search stations..." id="searchInput">
    </div>
    <div class="gunty-banner">GUNTY RADIO /// OLD-SCHOOL STREAM MACHINE /// YACHT ROCK + PORTUGAL + PUNK ADDED</div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="yachtrock">Yacht Rock</button>
      <button class="filter-btn" data-filter="portugal">Portugal</button>
      <button class="filter-btn" data-filter="rock">Rock</button>
      <button class="filter-btn" data-filter="punk">Punk</button>
      <button class="filter-btn" data-filter="metal">Metal</button>
      <button class="filter-btn" data-filter="alternative">Alt</button>
      <button class="filter-btn" data-filter="hiphop">Hip Hop</button>
      <button class="filter-btn" data-filter="funk">Funk/Soul</button>
      <button class="filter-btn" data-filter="classical">Classical</button>
      <button class="filter-btn" data-filter="jazz">Jazz/Swing</button>
      <button class="filter-btn" data-filter="jamband">Jam</button>
      <button class="filter-btn" data-filter="eclectic">Eclectic</button>
      <button class="filter-btn" data-filter="talk">Talk</button>
      <button class="filter-btn" data-filter="pop">Pop</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="stations-grid" id="stationsGrid"></div>
  <div class="no-results" id="noResults" style="display:none">
    <div class="no-results-icon">:(</div>
    <p>No stations found</p>
  </div>
</main>

<div class="now-playing-bar" id="nowPlayingBar">
  <div class="now-playing-inner">
    <div class="np-station-icon" id="npIcon"></div>
    <div class="np-info">
      <div class="np-station-name" id="npStationName"></div>
      <div class="np-track" id="npTrack">Connecting...</div>
    </div>
    <div class="np-eq" id="npEq">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="np-controls">
      <button class="np-btn np-btn-play" id="npPlayBtn" title="Play/Pause">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="np-btn np-btn-stop" id="npStopBtn" title="Stop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <div class="np-volume">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="75">
    </div>
  </div>
</div>

<div class="error-toast" id="errorToast"></div>

<audio id="audioPlayer" crossorigin="anonymous"></audio>

<script>
const stations = [
  {
    id: '181-yacht-rock-main',
    name: '181.FM Yacht Rock',
    desc: 'Smooth grooves all day long. Certified 70s/80s yacht rock and soft rock classics.',
    tags: ['Yacht Rock', 'Soft Rock', '70s/80s'],
    filter: 'yachtrock',
    color: '#38BDF8',
    icon: 'YR',
    url: 'http://listen.181fm.com/181-yachtrock_128k.mp3',
    altUrls: []
  },
  {
    id: 'smooth-jazz-yacht',
    name: '101 Smooth Jazz',
    desc: 'Smooth, mellow grooves with a yacht-rock-friendly vibe for easy listening.',
    tags: ['Yacht Rock', 'Smooth', 'Easy Listening'],
    filter: 'yachtrock',

const audio = document.getElementById('audioPlayer');
const grid = document.getElementById('stationsGrid');
const npBar = document.getElementById('nowPlayingBar');
const npIcon = document.getElementById('npIcon');
const npStationName = document.getElementById('npStationName');
const npTrack = document.getElementById('npTrack');
const npPlayBtn = document.getElementById('npPlayBtn');
const npStopBtn = document.getElementById('npStopBtn');
const volumeSlider = document.getElementById('volumeSlider');
const searchInput = document.getElementById('searchInput');
const filtersEl = document.getElementById('filters');
const noResults = document.getElementById('noResults');
const errorToast = document.getElementById('errorToast');

let currentStation = null;
let isPlaying = false;
let currentUrlIndex = 0;
let streamReady = false;
let connectTimer = null;

/* ---- Track identification ----------------------------------------------------
   Stations embed the exact artist + title in their stream as ICY metadata.
   A browser's <audio> element throws that data away, but the page can open its
   own connection with fetch() and read the bytes directly - no helper program
   and nothing to install.

   The catch, measured across this station list: about 40 of 57 servers refuse
   cross-origin reads (no CORS headers), so their bytes are unreachable from a
   page no matter what. The rest identify themselves automatically. For those
   that don't, click the track line to type the song in; it is remembered for
   that station.
------------------------------------------------------------------------------ */
const TRACK_STORE = 'gunty-radio-tracks';
const JUNK_VALUES = new Set(['', '-', '--', '---', 'null', 'none', 'n/a', 'na', 'unknown']);
let trackScanCtrl = null;
let trackScanTimer = null;
let trackIdentified = false;
let trackSettled = false;

function manualKey() {
  return currentStation ? 'rw:' + currentStation.id : null;
}

function getManualTrack() {
  const key = manualKey();
  if (!key) return null;
  try {
    const all = JSON.parse(localStorage.getItem(TRACK_STORE) || '{}');
    return all[key] || null;
  } catch (err) {
    return null;
  }
}

function saveManualTrack(text) {
  const key = manualKey();
  if (!key) return;
  let all = {};
  try { all = JSON.parse(localStorage.getItem(TRACK_STORE) || '{}'); } catch (err) {}
  if (text) all[key] = text;
  else delete all[key];
  try { localStorage.setItem(TRACK_STORE, JSON.stringify(all)); } catch (err) {}
}

// Some encoders HTML-escape metadata: "That&apos;s the Way".
function decodeEntities(str) {
  const safe = String(str).replace(/[<>]/g, '');
  const holder = document.createElement('textarea');
  holder.innerHTML = safe;
  return holder.value;
}

// Stations disagree about field order. All of these occur in the wild:
//   'Orville Peck - Too Little'          artist - title
//   'I Feel You - Depeche Mode - Songs'   title - artist - album
//   'The Brian Lehrer Show-'              show name only
//   '-'                                    placeholder, ignore
function parseTrack(raw) {
  let text = String(raw || '').replace(/\s+/g, ' ').trim();
  text = text.replace(/\s*[-–—]+\s*$/, '').replace(/^\s*[-–—]+\s*/, '').trim();
  if (JUNK_VALUES.has(text.toLowerCase())) return null;
  const parts = text.split(/\s+[-–—]\s+/).map(s => s.trim()).filter(Boolean);
  if (parts.length === 1) return { artist: null, title: parts[0] };
  if (parts.length === 2) return { artist: parts[0], title: parts[1] };
  return { artist: parts[1], title: parts[0] };
}

const TRACK_CLASSES = 'is-id is-none is-manual is-editing';

function resetTrackClasses(mode) {
  npTrack.classList.remove('is-id', 'is-none', 'is-manual', 'is-editing');
  if (mode) npTrack.classList.add(mode);
}

function setTrackLine(text, mode) {
  resetTrackClasses(mode);
  npTrack.textContent = text;
}

function showIdentifiedTrack(artist, title) {
  trackIdentified = true;
  trackSettled = true;
  resetTrackClasses('is-id');
  npTrack.innerHTML = artist
    ? `<span class="np-artist">${escapeHtml(artist)}</span> &ndash; <span class="np-song">${escapeHtml(title)}</span>`
    : escapeHtml(title);
}

function showManualTrack(text) {
  trackIdentified = true;
  trackSettled = true;
  resetTrackClasses(null);
  npTrack.classList.add('is-id', 'is-manual');
  npTrack.innerHTML = escapeHtml(text);
}

// Once a scan has produced an answer, playback events must not overwrite it.
function setStatusLine(text) {
  if (trackIdentified || trackSettled) return;
  setTrackLine(text, null);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function stopTrackScan() {
  if (trackScanCtrl) {
    trackScanCtrl.abort();
    trackScanCtrl = null;
  }
  clearTimeout(trackScanTimer);
  trackScanTimer = null;
}

function settleUnavailable() {
  if (trackIdentified) return;
  trackScanCtrl = null;
  trackSettled = true;
  resetTrackClasses('is-none');
  npTrack.innerHTML = `Can't read this stream &mdash; click to add the song`;
}

// Reads the raw stream and picks the first StreamTitle out of it. Works
// without knowing icy-metaint, since the metadata frames are self-labelling.
async function scanStreamForTrack(url) {
  stopTrackScan();
  if (!url || !currentStation) return;

  const manual = getManualTrack();
  if (manual) {
    showManualTrack(manual);
    return;
  }

  trackIdentified = false;
  trackSettled = false;
  setTrackLine('Identifying...', 'is-none');

  const ctrl = new AbortController();
  trackScanCtrl = ctrl;
  trackScanTimer = setTimeout(() => ctrl.abort(), 15000);

  try {
    const res = await fetch(url, {
      signal: ctrl.signal,
      headers: { 'Icy-MetaData': '1' },
      cache: 'no-store'
    });
    if (!res.ok || !res.body || !res.body.getReader) throw new Error('unreadable');
    const reader = res.body.getReader();
    const decoder = new TextDecoder('latin1');
    let hay = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      hay += decoder.decode(value, { stream: true });
      const match = hay.match(/StreamTitle='(.*?)';/);
      if (match) {
        const parsed = parseTrack(decodeEntities(match[1].trim()));
        reader.cancel().catch(() => {});
        if (parsed && currentStation) showIdentifiedTrack(parsed.artist, parsed.title);
        else settleUnavailable();
        return;
      }
      if (hay.length > 300000) hay = hay.slice(-80000);
    }
    settleUnavailable();
  } catch (err) {
    settleUnavailable();
  } finally {
    clearTimeout(trackScanTimer);
    trackScanTimer = null;
    if (trackScanCtrl === ctrl) trackScanCtrl = null;
  }
}

// Click the track line to type or edit the song for this station.
function beginTrackEdit() {
  if (npTrack.querySelector('input')) return;
  stopTrackScan();
  const existing = getManualTrack() || (npTrack.classList.contains('is-id') ? npTrack.textContent.trim() : '');

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'np-track-input';
  input.placeholder = 'Artist - Song title';
  input.value = existing;
  input.setAttribute('aria-label', 'Song currently playing');

  const priorHtml = npTrack.innerHTML;
  const priorMode = npTrack.classList.contains('is-manual') ? 'is-id is-manual'
    : npTrack.classList.contains('is-id') ? 'is-id'
    : npTrack.classList.contains('is-none') ? 'is-none' : null;

  const finish = (commit) => {
    if (input.dataset.done) return;
    input.dataset.done = '1';
    const value = input.value.trim();
    input.remove();

    // Capture what was on screen before editing, so Escape can restore it.
    const before = priorHtml;
    const restore = () => {
      npTrack.innerHTML = before;
      resetTrackClasses(priorMode);
    };

    if (commit && value) {
      saveManualTrack(value);
      showManualTrack(value);
      return;
    }
    if (commit && !value) saveManualTrack('');   // cleared it out

    const stored = getManualTrack();
    if (stored) {
      showManualTrack(stored);
    } else if (priorMode === 'is-id' && priorHtml) {
      restore();
    } else if (currentStation) {
      const idx = currentUrlIndex > 0 && currentStation.altUrls
        ? Math.min(currentUrlIndex, currentStation.altUrls.length)
        : 0;
      const urls = [currentStation.url, ...(currentStation.altUrls || [])];
      scanStreamForTrack(urls[idx] || currentStation.url);
    }
  };

  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('click', (e) => e.stopPropagation());

  npTrack.textContent = '';
  resetTrackClasses('is-editing');
  npTrack.appendChild(input);
  input.focus();
  input.select();
}

npTrack.addEventListener('click', () => {
  if (!currentStation) return;
  if (npTrack.classList.contains('is-editing')) return;
  beginTrackEdit();
});

function clearConnectTimer() {
  if (connectTimer) {
    clearTimeout(connectTimer);
    connectTimer = null;
  }
}

audio.volume = volumeSlider.value / 100;

function renderStations(filter = 'all', search = '') {
  const filtered = stations.filter(s => {
    const matchFilter = filter === 'all' || s.filter === filter;
    const matchSearch = search === '' ||
      s.name.toLowerCase().includes(search) ||
      s.desc.toLowerCase().includes(search) ||
      s.tags.some(t => t.toLowerCase().includes(search));
    return matchFilter && matchSearch;
  });

  grid.innerHTML = filtered.map(s => `
    <div class="station-card ${currentStation?.id === s.id && isPlaying ? 'playing' : ''}" data-id="${s.id}">
      <div class="station-card-top">
        <div class="station-icon" style="background:${s.color}">${s.icon}</div>
        <div class="station-meta">
          <div class="station-name">${s.name}</div>
          <div class="station-desc">${s.desc}</div>
        </div>
      </div>
      <div class="station-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="station-bottom">
        <div class="station-status">
          <span class="status-dot"></span>
          <span>${currentStation?.id === s.id && isPlaying ? 'Now Playing' : 'Online'}</span>
        </div>
        <button class="station-play-btn" data-id="${s.id}" title="Play ${s.name}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            ${currentStation?.id === s.id && isPlaying
              ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
              : '<path d="M8 5v14l11-7z"/>'}
          </svg>
        </button>
      </div>
    </div>
  `).join('');

  noResults.style.display = filtered.length === 0 ? 'block' : 'none';

  grid.querySelectorAll('.station-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.station-play-btn')) return;
      const id = card.dataset.id;
      const station = stations.find(s => s.id === id);
      if (currentStation?.id === id && isPlaying) {
        pauseStation();
      } else if (currentStation?.id === id && !isPlaying) {
        resumeStation();
      } else {
        playStation(station);
      }
    });
  });

  grid.querySelectorAll('.station-play-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const station = stations.find(s => s.id === id);
      if (currentStation?.id === id && isPlaying) {
        pauseStation();
      } else if (currentStation?.id === id && !isPlaying) {
        resumeStation();
      } else {
        playStation(station);
      }
    });
  });
}

function playStation(station) {
  currentStation = station;
  currentUrlIndex = 0;
  isPlaying = true;

  npBar.classList.add('active');
  npIcon.style.background = station.color;
  npIcon.textContent = station.icon;
  npStationName.textContent = station.name;
  setTrackLine('Connecting...', null);

  loadAndPlay(station.url);
  scanStreamForTrack(station.url);
  renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
  updatePlayButton();
}

function loadAndPlay(url) {
  clearConnectTimer();
  streamReady = false;
  audio.src = url;
  audio.load();
  connectTimer = setTimeout(() => {
    if (!streamReady) advanceUrl();
  }, 15000);
  audio.play().catch(err => {
    clearConnectTimer();
    if (err && err.name === 'NotAllowedError') {
      isPlaying = false;
      updatePlayButton();
      renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
      setStatusLine('Press play to start');
      return;
    }
    advanceUrl();
  });
}

function advanceUrl() {
  if (!currentStation) return;
  clearConnectTimer();
  const urls = [currentStation.url, ...(currentStation.altUrls || [])];
  currentUrlIndex++;
  if (currentUrlIndex < urls.length) {
    setStatusLine('Trying alternate stream...');
    loadAndPlay(urls[currentUrlIndex]);
    scanStreamForTrack(urls[currentUrlIndex]);
  } else {
    showError(`Could not connect to ${currentStation.name}`);
    stopStation();
  }
}

function pauseStation() {
  audio.pause();
  isPlaying = false;
  updatePlayButton();
  renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
}

function resumeStation() {
  audio.play().then(() => {
    isPlaying = true;
    updatePlayButton();
    renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
  }).catch(() => advanceUrl());
}

function stopStation() {
  clearConnectTimer();
  stopTrackScan();
  trackIdentified = false;
  trackSettled = false;
  currentStation = null;
  isPlaying = false;
  streamReady = false;
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  npBar.classList.remove('active');
  renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
}

function updatePlayButton() {
  npPlayBtn.innerHTML = isPlaying
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  npPlayBtn.classList.toggle('playing', isPlaying);
}

function showError(msg) {
  errorToast.textContent = msg;
  errorToast.classList.add('show');
  setTimeout(() => errorToast.classList.remove('show'), 4000);
}

function getCurrentFilter() {
  const active = filtersEl.querySelector('.filter-btn.active');
  return active ? active.dataset.filter : 'all';
}

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayButton();
  renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
  if (currentStation) {
    setStatusLine('Live Stream');
  }
});

audio.addEventListener('pause', () => {
  if (currentStation) {
    isPlaying = false;
    updatePlayButton();
    renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
  }
});

audio.addEventListener('error', () => {
  if (!currentStation) return;
  if (!streamReady) setStatusLine('Connecting...');
});

audio.addEventListener('playing', () => {
  streamReady = true;
  clearConnectTimer();
  if (currentStation) {
    setStatusLine('Live Stream');
  }
});

audio.addEventListener('loadedmetadata', () => {
  if (currentStation) {
    setStatusLine('Live Stream');
  }
});

volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
});

npPlayBtn.addEventListener('click', () => {
  if (!currentStation) return;
  if (isPlaying) pauseStation();
  else resumeStation();
});

npStopBtn.addEventListener('click', stopStation);

searchInput.addEventListener('input', () => {
  renderStations(getCurrentFilter(), searchInput.value.toLowerCase());
});

filtersEl.addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-btn')) return;
  filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderStations(e.target.dataset.filter, searchInput.value.toLowerCase());
});

renderStations();
</script>
